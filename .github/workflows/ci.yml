name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  node-check:
    name: Node Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Spell check
        run: npm run spellcheck

      - name: Test command
        run: npm test

      - name: Pack npm package
        run: |
          mkdir "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  test-npm:
    name: Test npm (Node ${{ matrix.node }})
    needs: node-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Download npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Install and run package
        env:
          NPM_PACKAGE_DIRECTORY: ${{ runner.temp }}/npm-package
        run: node --test .github/scripts/npm-consumer.test.mjs

  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v1
        with:
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false

      - name: Run flake check
        run: nix flake check

  nix-build:
    name: Nix Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v1
        with:
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false

      - name: Build and test package
        run: nix build .#kiln-tailwindcss --no-link --print-build-logs

  result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs: [node-check, test-npm, flake-check, nix-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check results
        uses: hakula139/devkit/.github/actions/ci-result@v1
