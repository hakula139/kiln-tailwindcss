name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  node-check:
    name: Node Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Spell check
        run: npm run spellcheck

      - name: Test command
        run: npm test

      - name: Pack npm package
        run: |
          mkdir "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  test-npm:
    name: Test npm (Node ${{ matrix.node }})
    needs: node-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 26]
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Download npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Install and run package
        shell: bash
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir "$root/consumer" "$root/site"
          cd "$root/consumer"

          npm install --no-audit --no-fund "$RUNNER_TEMP"/npm-package/*.tgz
          npm ci --omit=dev --no-audit --no-fund

          printf '%s\n' '@import "tailwindcss" source(none); @plugin "@tailwindcss/typography"; @source inline("flex prose");' > "$root/site/input.css"
          NODE_PATH='' node_modules/.bin/kiln-tailwindcss "$root/site/input.css" > "$root/site/output.css" 2> "$root/site/diagnostics.txt"
          test ! -s "$root/site/diagnostics.txt"

          cd "$root/site"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const css = await readFile('output.css', 'utf8');

          assert.match(css, /\.flex\s*\{\s*display: flex;/);
          assert.match(css, /\.prose\s*\{/);
          assert.match(css, /max-width: 65ch/);
          NODE

  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Run flake check
        run: nix flake check

  nix-build:
    name: Nix Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build and test package
        run: nix build .#kiln-tailwindcss --no-link --print-build-logs
