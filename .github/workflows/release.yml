name: Release

on:
  push:
    tags: ['v[0-9]+.*']

permissions:
  contents: read

jobs:
  tagged-ci:
    name: Tagged CI
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI
        uses: hakula139/devkit/actions/tagged-ci@b3c36cb40179dcc4c226b0fee6e474577accecfb

  publish:
    needs: tagged-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Verify release version
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$GITHUB_REF_NAME" == "v$version" ]]

      - name: Install dependencies
        run: npm ci

      - name: Test command
        run: npm test

      - name: Publish npm package
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            npm publish --tag next
          else
            npm publish --tag latest
          fi

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=("$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
